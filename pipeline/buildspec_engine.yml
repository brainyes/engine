version: 0.2
phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ENGINE_IMAGE_REPOSITORY
      - echo Downloading FreeSurfer packages from S3...
      - aws s3 cp s3://$BUILD_ASSETS_BUCKET/freesurfer_ubuntu22-8.1.0_amd64.deb . --region $AWS_DEFAULT_REGION || echo "FreeSurfer 8 not in S3, will download from Harvard server during build"
      - aws s3 cp s3://$BUILD_ASSETS_BUCKET/freesurfer_ubuntu22-7.4.1_amd64.deb . --region $AWS_DEFAULT_REGION || echo "FreeSurfer 7 not in S3, will download from Harvard server during build"
      - echo Build started on `date`
  build:
    commands:
      - echo Build started on `date`
      - echo Pulling previous image for layer caching...
      - docker pull $ENGINE_IMAGE_REPOSITORY:latest || true
      - echo Building the Docker image for ECS Engine with cache...
      - export DOCKER_BUILDKIT=1
      - docker build -f Dockerfile -t engine:latest --cache-from $ENGINE_IMAGE_REPOSITORY:latest --build-arg BUILD_ASSETS_BUCKET=$BUILD_ASSETS_BUCKET --build-arg BUILDKIT_INLINE_CACHE=1 .
      - docker tag engine:latest $ENGINE_IMAGE_REPOSITORY:latest
      - docker tag engine:latest $ENGINE_IMAGE_REPOSITORY:$CODEBUILD_BUILD_NUMBER
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images...
      - docker push $ENGINE_IMAGE_REPOSITORY:latest
      - docker push $ENGINE_IMAGE_REPOSITORY:$CODEBUILD_BUILD_NUMBER
      - echo Updating ECS task definition...
      - aws ecs describe-task-definition --task-definition brainyes-task --query taskDefinition --region $AWS_DEFAULT_REGION > task-definition.json
      - jq --arg IMAGE_URI "$ENGINE_IMAGE_REPOSITORY:$CODEBUILD_BUILD_NUMBER" 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy) | .containerDefinitions[0].image = $IMAGE_URI' task-definition.json > updated-task-definition.json
      - aws ecs register-task-definition --region $AWS_DEFAULT_REGION --cli-input-json file://updated-task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text > new-task-definition-arn.txt
      - echo New task definition ARN':' $(cat new-task-definition-arn.txt)
      - echo Engine image build and ECS update completed successfully