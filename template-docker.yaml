AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BrainYes Engine Serverless Architecture with Docker

Globals:
  Function:
    Timeout: 900  # 15 minutes max for Lambda
    MemorySize: 3008  # Max memory for better performance with scientific computing
    Environment:
      Variables:
        SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_KEY: !Ref SupabaseKey
        TASK_QUEUE_URL: !Ref TaskQueue

Parameters:
  SupabaseUrl:
    Type: String
    Description: Supabase project URL
    NoEcho: true
  
  SupabaseKey:
    Type: String
    Description: Supabase service role key
    NoEcho: true
  
  ECSImageUri:
    Type: String
    Description: ECR image URI for ECS tasks (same as Lambda image)
    Default: ""

Resources:

  # Minimal VPC with public subnets only (no NAT Gateway = free)
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: brainyes-vpc

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: brainyes-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnets (2 AZs for ECS)
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: brainyes-public-subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: brainyes-public-subnet-2

  # Route Table for Public Subnets
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: brainyes-public-routes

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # Private Subnets (for RDS, ElastiCache, etc. - no internet access)
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: brainyes-private-subnet-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: brainyes-private-subnet-2

  # Private Route Table (no internet route = no NAT Gateway needed)
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: brainyes-private-routes

  PrivateSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # Security Group for ECS Tasks (minimal - allow outbound only)
  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS tasks in public subnets
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: brainyes-ecs-sg

  # API Gateway
  BrainYesApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"

  # Single Lambda Function with API Gateway routing
  BrainYesFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers.lambda_handlers.router_handler"]
      Architectures:
        - arm64
      Environment:
        Variables:
          SUBNET_1: !Ref PublicSubnet1
          SUBNET_2: !Ref PublicSubnet2
          SECURITY_GROUP: !Ref EcsSecurityGroup
          POPULATION_DATASET_BUCKET: !Ref PopulationDatasetBucket
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt TaskQueue.QueueName
        - SQSPollerPolicy:
            QueueName: !GetAtt TaskQueue.QueueName
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:GetLogEvents
                - logs:FilterLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/brainyes-task:*'
            - Effect: Allow
              Action:
                - ecs:RunTask
                - ecs:DescribeTasks
              Resource: '*'
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource:
                - !GetAtt EcsExecutionRole.Arn
                - !GetAtt EcsTaskRole.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
                - s3:DeleteObject
              Resource:
                - !GetAtt PopulationDatasetBucket.Arn
                - !Sub '${PopulationDatasetBucket.Arn}/*'
      Events:
        # Function execution endpoints
        PostFunction:
          Type: Api
          Properties:
            RestApiId: !Ref BrainYesApi
            Path: /function/{function_name}
            Method: POST
        PostFunctionRoot:
          Type: Api
          Properties:
            RestApiId: !Ref BrainYesApi
            Path: /function
            Method: POST
        # Async task endpoints
        SubmitAsyncTask:
          Type: Api
          Properties:
            RestApiId: !Ref BrainYesApi
            Path: /async/{function_name}
            Method: POST
        # Management endpoints
        ListFunctions:
          Type: Api
          Properties:
            RestApiId: !Ref BrainYesApi
            Path: /functions
            Method: GET
        GetTaskStatus:
          Type: Api
          Properties:
            RestApiId: !Ref BrainYesApi
            Path: /tasks/{task_id}/status
            Method: GET
        GetTaskLogs:
          Type: Api
          Properties:
            RestApiId: !Ref BrainYesApi
            Path: /tasks/{task_id}/logs
            Method: GET
        # ECS Task State Change Events
        EcsTaskStateChange:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.ecs
              detail-type:
                - ECS Task State Change
              detail:
                clusterArn:
                  - !GetAtt EcsCluster.Arn
        # SQS trigger for launching ECS tasks
        SqsTaskTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt TaskQueue.Arn
            BatchSize: 1
    Metadata:
      Dockerfile: Dockerfile.lambda
      DockerContext: ./
      DockerTag: latest

  # SQS Queue for async tasks
  TaskQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: brainyes-task-queue
      VisibilityTimeout: 43200  # 12 hours (must be >= ECS task timeout)
      MessageRetentionPeriod: 1209600  # 14 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: brainyes-task-dlq
      MessageRetentionPeriod: 1209600  # 14 days

  # S3 Bucket for Population Dataset Storage (OASIS, HCP, etc.)
  PopulationDatasetBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-population-datasets'
      # Intelligent-Tiering: automatically moves data to cheaper storage after 30/90 days
      IntelligentTieringConfigurations:
        - Id: EntireBucket
          Status: Enabled
          Tierings:
            - AccessTier: ARCHIVE_ACCESS
              Days: 90
            - AccessTier: DEEP_ARCHIVE_ACCESS
              Days: 180
      # Lifecycle policy to optimize costs
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIntelligentTiering
            Status: Enabled
            Transitions:
              - TransitionInDays: 0
                StorageClass: INTELLIGENT_TIERING
      # Versioning for safety (can recover accidentally deleted datasets)
      VersioningConfiguration:
        Status: Enabled
      # Block public access (private bucket)
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Server-side encryption
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Purpose
          Value: Population dataset storage - OASIS HCP and others
        - Key: CostCenter
          Value: Research

  # ECS Resources (same as before)
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: brainyes-cluster
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT

  EcsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: brainyes-task
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64  # Required for FreeSurfer compatibility
        OperatingSystemFamily: LINUX
      Cpu: '16384'  # 2 vCPU
      Memory: '32768'  # 8 GB RAM
      EphemeralStorage:
        SizeInGiB: 200  # Maximum for Fargate - needed for 30GB FreeSurfer image extraction
      ExecutionRoleArn: !Ref EcsExecutionRole
      TaskRoleArn: !Ref EcsTaskRole
      ContainerDefinitions:
        - Name: brainyes-container
          Image: !Ref ECSImageUri
          Essential: true
          Environment:
            - Name: SUPABASE_URL
              Value: !Ref SupabaseUrl
            - Name: SUPABASE_KEY
              Value: !Ref SupabaseKey
            - Name: TASK_QUEUE_URL
              Value: !Ref TaskQueue
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: LAMBDA_API_URL
              Value: !Sub 'https://${BrainYesApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
            - Name: POPULATION_DATASET_BUCKET
              Value: !Ref PopulationDatasetBucket
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  EcsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/brainyes-task
      RetentionInDays: 30

  # IAM Roles
  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: '*'

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SQSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt TaskQueue.Arn
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !GetAtt PopulationDatasetBucket.Arn
                  - !Sub '${PopulationDatasetBucket.Arn}/*'


Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${BrainYesApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  
  TaskQueueUrl:
    Description: SQS Queue URL for async tasks
    Value: !Ref TaskQueue
  
  ECSImageUri:
    Description: ECS container image URI parameter
    Value: !Ref ECSImageUri